[[shots]]
img = "interlinear"
title = "El griego palabra por palabra"
text = "Abra un interlineal junto a cualquier Biblia y lea el Nuevo Testamento griego o la Biblia hebrea palabra por palabra, con la glosa, el análisis y el número de Strong bajo cada una. Las glosas están en inglés."
alt = "El interlineal griego en Juan 1, junto a la Reina-Valera"

[[shots]]
img = "voices"
title = "La Iglesia en cada versículo"
text = "Junto a cualquier pasaje, Voces de la Iglesia reúne lo que escribieron sobre él los padres, los maestros medievales y los reformadores: 87.995 citas, de Ireneo a Calvino, ordenadas por versículo y fechadas por siglo. Las citas están en inglés."
alt = "Voces de la Iglesia junto a Juan 1, agrupadas por época"

[[shots]]
img = "art"
title = "Arte para el pasaje que está leyendo"
text = "La Escritura en el arte pone pinturas, grabados, iconos y vidrieras junto al versículo que tiene en pantalla: 1.256 imágenes, de La vocación de san Mateo de Caravaggio a los grabados de Doré, cada una con su fuente y su crédito. Los títulos están en inglés."
alt = "Mateo 9 junto a La vocación de san Mateo, de Caravaggio"

[[shots]]
img = "reading"
title = "Modo de lectura"
text = "Deje en pantalla solo el texto. Siete papeles, del blanco al negro, cada uno con su propia tinta, y la letra capital en oro."
alt = "El Salmo 23 en modo de lectura"

