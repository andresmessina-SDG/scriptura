[[shots]]
img = "interlinear"
title = "Греческий текст слово за словом"
text = "Откройте подстрочник рядом с любой Библией и читайте греческий Новый Завет или еврейскую Библию по одному слову, с переводом, разбором и номером Стронга под каждым. Переводы слов — на английском."
alt = "Греческий подстрочник к Иоанна 1 рядом с Русским открытым переводом"

[[shots]]
img = "voices"
title = "Голос Церкви к каждому стиху"
text = "Рядом с любым отрывком Голоса Церкви собирают то, что писали о нём отцы, средневековые учители и реформаторы: 87 995 цитат, от Иринея до Кальвина, по стихам и по векам. Цитаты на английском."
alt = "Голоса Церкви рядом с Иоанна 1, по эпохам"

[[shots]]
img = "art"
title = "Искусство к читаемому отрывку"
text = "Писание в искусстве ставит рядом со стихом на экране картины, гравюры, иконы и витражи: 1256 изображений, от «Призвания апостола Матфея» Караваджо до гравюр Доре, у каждого указаны источник и автор. Названия — на английском."
alt = "Матфея 9 рядом с картиной Караваджо «Призвание апостола Матфея»"

[[shots]]
img = "reading"
title = "Режим чтения"
text = "Оставьте на экране только текст. Семь видов бумаги, от белой до чёрной, у каждой свои чернила, а буквица — золотом."
alt = "Псалтирь 23 в режиме чтения"

