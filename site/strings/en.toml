[[shots]]
img = "interlinear"
title = "The Greek word by word"
text = "Open an interlinear beside any Bible and read the Greek New Testament or the Hebrew Bible one word at a time, with the gloss, the parsing and the Strong’s number under each. The variant readings and the Hebrew Ketiv are a click away."
alt = "The Greek interlinear at John 1, beside the King James Version"

[[shots]]
img = "voices"
title = "The church on every verse"
text = "Beside any passage, Voices of the Church gathers what the fathers, the medieval teachers and the Reformers wrote about it: 87,995 quotations from Irenaeus to Calvin, each filed under the verse it explains and dated by its century."
alt = "Voices of the Church beside John 1, grouped by era"

[[shots]]
img = "art"
title = "Art for the passage you are reading"
text = "Scripture in Art sets paintings, engravings, icons and stained glass beside the verse on your screen: 1,256 images, from Caravaggio’s Calling of Saint Matthew to Doré’s engravings, each with its source and credit."
alt = "Matthew 9 beside Caravaggio’s The Calling of Saint Matthew"

[[shots]]
img = "reading"
title = "Reading mode"
text = "Clear everything but the text. Seven papers, from white to black, each come with their own ink, and the drop cap is set in gold."
alt = "Psalm 23 in reading mode"

