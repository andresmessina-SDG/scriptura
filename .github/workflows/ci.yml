# GitHub Actions CI — runs the test suite, type-checks, and the scroll-
# stability matrix on every push and pull request. Ported from the former
# Codeberg Woodpecker pipeline.
#
# Fedora container: the suite imports the SWORD Python binding (python3-sword)
# and the GTK4 / libadwaita / PyGObject stack, all stock Fedora packages — the
# same set the app builds against. The test job runs them under Broadway.
#
# The image is pinned: `fedora:latest` moved to Python 3.15 and GTK 4.24 on its
# own and turned the stress job red on a commit that had passed. Move to a new
# Fedora on purpose, in a commit of its own, and read what it breaks.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # --setopt install_weak_deps=False keeps the layer lean; -y for non-interactive.
      # gobject-introspection ships cairo-1.0.typelib, which the app's Gtk imports
      # need at test-collection time (a weak dep skipped by install_weak_deps=False).
      - name: Install deps
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          python3-pytest python3-mypy python3-pyflakes python3-sword
          python3-gobject gobject-introspection gtk4 libadwaita
          words gettext fontconfig
          adwaita-sans-fonts google-noto-sans-vf-fonts
      # The app installs its bundled faces to share/fonts/scriptura, and three
      # tests ask what Pango actually resolves a Cyrillic or Latin run to — a
      # container without them answers "Noto Sans" and the reading serif looks
      # like a regression. The genealogy plate audit needs them for the same
      # reason, and needs Adwaita Sans as well: it measures whether a name
      # collides with its gloss, and a fallback face is wider than the one the
      # charts are actually drawn in, so a missing font reads as a collision.
      - name: Install the bundled fonts
        run: |
          mkdir -p /usr/share/fonts/scriptura
          cp data/fonts/*.ttf data/fonts/*.otf /usr/share/fonts/scriptura/
          fc-cache -f
      # Under Broadway, so the GTK tests run. They skip themselves when there
      # is no display, because building a widget without one segfaults rather
      # than failing, and this job used to run without one: about 640 tests,
      # the panes, lexicon, search panel and editors among them, skipped on
      # every push while the job stayed green.
      #
      # A scratch HOME and XDG dirs, like the harnesses below, so GTK's own
      # files (recently-used, the Broadway socket) have somewhere private to
      # go. The bundled fonts are in /usr/share/fonts, which the scratch
      # XDG_DATA_HOME does not hide.
      #
      # The display check is the point of the step: if broadwayd does not
      # come up, the GTK tests skip and the run looks green, which is the
      # failure this step exists to end. So no display fails the job, and
      # -rs lists every skip in the log.
      - name: Tests (under Broadway)
        run: |
          scratch=$(mktemp -d)
          for d in home config data cache runtime; do mkdir -m 700 "$scratch/$d"; done
          export HOME="$scratch/home" XDG_CONFIG_HOME="$scratch/config" \
                 XDG_DATA_HOME="$scratch/data" XDG_CACHE_HOME="$scratch/cache" \
                 XDG_RUNTIME_DIR="$scratch/runtime"
          gtk4-broadwayd :3 >/dev/null 2>&1 &
          for _ in $(seq 100); do
            [ -S "$XDG_RUNTIME_DIR/broadway4.socket" ] && break
            sleep 0.05
          done
          [ -S "$XDG_RUNTIME_DIR/broadway4.socket" ] || { echo 'gtk4-broadwayd did not start'; exit 1; }
          export GDK_BACKEND=broadway BROADWAY_DISPLAY=:3
          # Importing Gtk is what opens the display (PyGObject's override runs
          # gtk_init); Gdk alone answers None even with Broadway up.
          python3 -c "import gi; gi.require_version('Gdk', '4.0'); gi.require_version('Gtk', '4.0'); from gi.repository import Gdk, Gtk; assert Gdk.Display.get_default() is not None, 'no display: the GTK tests would all skip'"
          python3 -m pytest -q -rs
      # tools/ are standalone build-time generation scripts (maps, packs), not
      # the shipped app — kept out of the CI type gate. The app's typed layer
      # is checked exactly as `mypy .` does locally.
      - name: Type-check
        run: python3 -m mypy . --exclude '^tools/'
      # A name used and never defined, in a branch no test takes.
      - name: Pyflakes
        run: python3 -m pyflakes *.py tests/*.py tools/*.py

  # Drives the real app under GTK Broadway and asserts the "reading text never
  # moves" invariant (ARCHITECTURE.md). A separate job so a CrossWire outage or
  # Broadway flake is visibly not a test/typecheck failure.
  scroll-stability:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # gobject-introspection carries the cairo typelib PyGObject imports at
      # Gtk load time (a weak dep skipped by install_weak_deps=False).
      - name: Install deps
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          python3-gobject gobject-introspection gtk4 libadwaita
          python3-sword sword-utils dejavu-sans-fonts dejavu-serif-fonts
      # KJVA + MHCC from CrossWire; the flag is installmgr's documented
      # non-interactive mode.
      - name: Fetch test modules
        run: >-
          installmgr --allow-internet-access-and-risk-tracing-and-jail-or-martyrdom
          -init -sc -r CrossWire -ri CrossWire KJVA -ri CrossWire MHCC
      # Two retries, not the default one. A shared CI runner is slow enough
      # that GtkTextView's line validation sometimes has not finished when the
      # harness parks the panes; that run measures a document still being laid
      # out and can only be thrown away. Exit 2 is the harness saying so — it
      # never established its own starting state — and it stays a failure
      # here on purpose: a check that cannot run is a check that is not
      # guarding anything, and it should be loud rather than quietly green.
      - name: Scroll-stability matrix
        run: python3 tools/verify-scroll-stability.py --retries 2

  # Asserts the accessible tree — roles, relations, and live-region status —
  # which nothing visible can catch. Separate job for the same reason as
  # scroll-stability. No `mutter` in the container (it needs a DRM device), so
  # this falls back to Broadway and the harness skips the announcement checks;
  # the role/relation half is what CI guards. Run it locally for the full set.
  accessibility:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          python3-gobject gobject-introspection gtk4 libadwaita
          python3-sword sword-utils dejavu-sans-fonts dejavu-serif-fonts
      - name: Fetch test modules
        run: >-
          installmgr --allow-internet-access-and-risk-tracing-and-jail-or-martyrdom
          -init -sc -r CrossWire -ri CrossWire KJVA -ri CrossWire MHCC
      - name: Accessible-tree checks
        run: python3 tools/verify-a11y.py

  # Hammers the real app: junk in every setting and store file, module
  # install and removal under an open pane, the welcome hand-off, a restore
  # racing the editor's autosave, Replace All over 8k words. Each scenario
  # adapts to the modules present (KJVA + MHCC here) and fails on any ERROR
  # record, GLib CRITICAL, raised step or scenario assertion. Written after
  # 2,248 green unit tests sat over three interaction bugs (1.7.2 sweep).
  stress:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          python3-gobject gobject-introspection gtk4 libadwaita
          python3-sword sword-utils dejavu-sans-fonts dejavu-serif-fonts
      - name: Fetch test modules
        run: >-
          installmgr --allow-internet-access-and-risk-tracing-and-jail-or-martyrdom
          -init -sc -r CrossWire -ri CrossWire KJVA -ri CrossWire MHCC
      - name: Stress scenarios
        run: python3 tools/verify-stress.py
