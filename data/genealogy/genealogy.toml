# ── charts ──────────────────────────────────────────────────────────────
# `structure` picks the drawing: spine · household · lifespan · witnesses.
# `register` adds the banded-generation overlay (only Matthew counts himself).

[[chart]]
id = "gen5"
structure = "spine"
title = "From Adam to Noah"
subtitle = "The ten before the flood"
passage = "Genesis 5"
root = "adam"
leaf = "noah"
intro = "One name a generation for ten generations, each with a number attached. Read as a list it is inert; read as a field of overlapping lives it is astonishing."
companion = "gen5_lives"

[[chart]]
id = "gen5_lives"
structure = "lifespan"
title = "Ten lives, laid on one axis"
subtitle = "Genesis 5, reckoned in years from Adam"
passage = "Genesis 5"
tradition = "mt"
intro = "Every figure here is arithmetic on Genesis 5:3–32, and the arithmetic assumes what the text does not state: that the ten follow one another with no gap. Read that way, two things fall out that no list can show — these ten lives overlap almost completely, and Methuselah's nine hundred and sixty-nine years run out in the year the flood comes. The years are a reckoning, not a date the Bible gives."

[[chart]]
id = "gen11"
structure = "spine"
title = "From Shem to Abraham"
subtitle = "The ten after the flood"
passage = "Genesis 11:10–26"
root = "shem"
leaf = "abraham"
intro = "The same shape as Genesis 5, and the lifespans fall away as it runs — from Shem's six hundred years to Terah's two hundred and five."

[[chart]]
id = "house_jacob"
structure = "household"
title = "The house of Jacob"
subtitle = "Four mothers, twelve sons"
passage = "Genesis 35:23–26"
root = "jacob"
intro = "Drawn father-only, this is a list of twelve names. Drawn with the mothers, it is the reason the tribes are grouped the way they are for the rest of the Bible."

[[chart]]
id = "ruth"
structure = "spine"
title = "The line Ruth ends on"
subtitle = "Ten names, from Perez to David"
passage = "Ruth 4:18–22"
root = "perez"
leaf = "david"
intro = "The book of Ruth exists to arrive here. The same ten men appear in Matthew 1 under their Greek names — Perez is Phares, Hezron is Esrom, Boaz is Booz."

[[chart]]
id = "matthew"
structure = "spine"
title = "Matthew's genealogy"
subtitle = "Abraham to the Christ, in three sets of fourteen"
passage = "Matthew 1:1–17"
root = "abraham"
leaf = "jesus"
register = true
intro = "Matthew counts his own list out loud in 1:17, and his list also passes over four kings Chronicles names. Both facts are drawn here — the bands are his count, the dashed edges are the omissions — and the chart does not say the one caused the other. Ancient genealogy omits generations as a matter of course, and \"begat\" can span them; the fourteens are also read as a mnemonic, and as the numerical value of David's name."

[[chart]]
id = "luke"
structure = "spine"
title = "Luke's genealogy"
subtitle = "Jesus back to Adam, and past him"
passage = "Luke 3:23–38"
root = "god"
leaf = "jesus"
intro = "Luke runs the other way — from Jesus backwards — and does not stop at Abraham. He ends at Adam, and then at God, which is a claim rather than a link. Luke gives the older names in their Greek forms — Saruch for Serug, Ragau for Reu, Noe for Noah; one spelling is kept per man here so the two lists can be laid side by side, and either form finds him."

[[chart]]
id = "witnesses"
structure = "witnesses"
title = "Matthew and Luke, side by side"
subtitle = "Where the two lists touch, and where they part"
passage = "Matthew 1:1–17"
passage_b = "Luke 3:23–38"
left = "matthew"
right = "luke"
intro = "Both trace Jesus through David. They agree at David, at Shealtiel and Zerubbabel, and at Joseph — and nowhere in between. This chart states that and stops; the classical answers are set out below it, and none of them is chosen here."

# ── the three classical readings of the Matthew/Luke difference ──────────
# Attributed, not adjudicated. Same discipline as a contested site on a map.

[[reading]]
chart = "witnesses"
title = "Luke gives Mary's line"
body = "On this reading Matthew traces Joseph's descent and Luke traces Mary's, with Heli as her father and Joseph named as his son by marriage. It accounts for the two fathers of Joseph directly."
attribution = "Annius of Viterbo (1490s); widely held since, and the common answer in modern evangelical commentary."
caveat = "Luke's text names Joseph, not Mary, and the reading has to supply the step."

[[reading]]
chart = "witnesses"
title = "Levirate marriage"
body = "A man dying childless had his brother raise up offspring in his name (Deut 25:5–6), so one man can have a legal father and a biological one. Africanus has Heli and Jacob as half-brothers by one mother: Heli died childless, Jacob raised up seed to him, and Joseph is son of Jacob by nature and of Heli by law."
attribution = "Julius Africanus, in a letter preserved by Eusebius, Church History I.7 (3rd century)."
caveat = "It requires a levirate marriage the text nowhere records."

[[reading]]
chart = "witnesses"
title = "Legal throne versus natural descent"
body = "Matthew follows the royal succession — who held or had claim to the throne — while Luke follows physical descent. The two diverge after David because a throne passes by law and blood passes by birth."
attribution = "Widely held among Protestant interpreters; set out at length by J. Gresham Machen, The Virgin Birth of Christ (1930)."
caveat = "It explains the shape of the difference better than it explains the two named fathers."
