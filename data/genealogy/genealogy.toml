# genealogy.toml — the curated table behind the genealogy charts.
#
# EVERY edge carries the verse it comes from. Nothing here is parsed out
# of prose at run time and nothing is supplied from memory: the citations
# were read off the KJV on disk, and the identities were checked by hand.
# A drafting regex offered "David the king begat Solomon" as an edge from
# a person named "king"; that is why this file is curated and not derived.
#
# Strings marked translatable: person `name`, `meaning`, `note`, edge
# `note`, and everything under [meta] and [[chart]]. tools/
# gen_genealogy_strings.py mirrors them into genealogy_strings.py so
# xgettext can see them; tests/test_genealogy.py fails when the two
# drift apart.

[meta]
title = "The Book of Generations"
subtitle = "The lines the Bible keeps, drawn so they can be held"
body = """
Scripture keeps lists of names, and readers skip them. They are not
filler: they are the spine the rest of the book hangs on, and the
writers put them where they did on purpose.

Every line below is drawn from the text and cites it. Where a
genealogy leaves generations out, the gap is drawn as a gap. Where two
writers disagree, both are shown and neither is quietly corrected.
"""

