<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Manuscript glyph for the Sermons page: a single leaf with a heading bar and
    two lines cut out of it — a page of prose, which is what a sermon is here.
    SOLID with the rules as holes, the same construction as the journal
    notebook beside it in the switcher, because an outlined page with rules
    inside it is mud at the 16px a switcher actually carries. Fill-only (#222);
    GTK4 recolors it.
  -->

  <g fill="#222">
    <path fill-rule="evenodd" d="M3.6 1.4 H12.4 A1.6 1.6 0 0 1 14 3.0 V13.0 A1.6 1.6 0 0 1 12.4 14.6 H3.6 A1.6 1.6 0 0 1 2 13.0 V3.0 A1.6 1.6 0 0 1 3.6 1.4 Z M4.3 3.9 H11.7 V5.7 H4.3 Z M4.3 7.5 H11.7 V8.7 H4.3 Z M4.3 10.3 H9.3 V11.5 H4.3 Z"/>
  </g>
</svg>
