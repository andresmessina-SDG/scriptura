<?xml version="1.0" encoding="UTF-8"?>
<!--
  Symbolic (monochrome) version of the app icon. Drawn at 16×16 per
  GNOME convention; libadwaita recolors via CSS at render time so the
  fill stays neutral (#222 absolutely, but theme overrides it). Mirrors
  the full-color icon's open-book silhouette in outline form — a spine
  down the middle, two leaves splaying outward, faint suggestion of
  text on each page.

  Weight pass 2026-07-27: leaf outline 1.0 → 2.0 and the ink grown from
  12×12 to the 14×14 Adwaita convention. At 1.0 this was the lightest
  glyph in the bundled set by a wide margin — half the GNOME 2px norm —
  and read visibly frailer than the stock symbolics beside it. The page
  lines went 0.5 → 1.2 with it; at 0.5 they aliased into grey mush at
  16px rather than reading as text. The centre gutter stays 1px: it is
  a gap between two leaves, not a stroke.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#222">
    <!-- Left leaf -->
    <path fill-rule="evenodd" d="M1 3 C1 1.9, 1.9 1, 3 1 L7.4 1 C7.73 1, 8 1.27, 8 1.6 L8 14.4 C8 14.73, 7.73 15, 7.4 14.85 C6.2 14.1, 4.2 13.8, 3 13.8 C1.9 13.8, 1 12.9, 1 11.8 Z M3 3 L3 11.8 C4.4 11.8, 5.9 12.05, 7 12.45 L7 3 Z"/>
    <!-- Right leaf (mirror) -->
    <path fill-rule="evenodd" d="M15 3 C15 1.9, 14.1 1, 13 1 L8.6 1 C8.27 1, 8 1.27, 8 1.6 L8 14.4 C8 14.73, 8.27 15, 8.6 14.85 C9.8 14.1, 11.8 13.8, 13 13.8 C14.1 13.8, 15 12.9, 15 11.8 Z M13 3 L13 11.8 C11.6 11.8, 10.1 12.05, 9 12.45 L9 3 Z"/>
    <!-- Suggested text lines (left leaf) -->
    <rect x="3.7" y="4.8" width="3" height="1.2" rx="0.6"/>
    <rect x="3.7" y="7"   width="3" height="1.2" rx="0.6"/>
    <rect x="3.7" y="9.2" width="2.4" height="1.2" rx="0.6"/>
    <!-- Suggested text lines (right leaf) -->
    <rect x="9.3" y="4.8" width="3" height="1.2" rx="0.6"/>
    <rect x="9.3" y="7"   width="3" height="1.2" rx="0.6"/>
    <rect x="9.9" y="9.2" width="2.4" height="1.2" rx="0.6"/>
  </g>
</svg>
