<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Highlight glyph for the Annotations page: a line of text with a marker
    stroke across the line under it.
  
    TWO elements, not three. The first cut drew three bars — two thin, one
    thick — and at the 16px a switcher actually carries, the weights level out
    and three stacked bars are a hamburger menu, which is what his screenshot
    showed. A hamburger needs three; this has two, of unmistakably different
    weights, and the stroke overhangs the text at both ends the way a marker
    overruns a word.
  
    Fill-only (#222) so GTK4 recolors it, like its neighbours.
  -->

  <g fill="#222">
    <rect x="3.0" y="3.0" width="10.2" height="1.6" rx="0.8"/>
    <rect x="1.3" y="7.4" width="13.4" height="4.6" rx="1.6"/>
  </g>
</svg>
