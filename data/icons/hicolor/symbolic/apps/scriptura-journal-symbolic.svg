<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Notebook glyph for the Journal page: a bound cover with a ribbon cut out of
    it, marking the day being written. SOLID with the ribbon as a hole, not an
    outline — an outlined cover with a margin rule inside it was legible at 96px
    and mud at the 16 a switcher actually carries. Distinct from the bookmark
    symbolic, which is the ribbon alone with no book around it. Fill-only
    (#222); GTK4 recolors it.
  -->

  <g fill="#222">
    <path fill-rule="evenodd" d="M4.6 1.4 H12.4 A1.6 1.6 0 0 1 14 3.0 V13.0 A1.6 1.6 0 0 1 12.4 14.6 H4.6 A1.6 1.6 0 0 1 3.0 13.0 V3.0 A1.6 1.6 0 0 1 4.6 1.4 Z M8.3 1.4 V8.2 L10.0 6.7 L11.7 8.2 V1.4 Z"/>
  </g>
</svg>
