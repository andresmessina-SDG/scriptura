<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    Glyph for "The Creeds": a written confession of faith. A cross stands
    where a drop cap would, and lines of text follow it. Drawn for this app.
    Fill-only (#222) so GTK4 recolors it like the symbolics beside it.
  -->
  <g fill="#222">
    <!-- the cross, set as the first letter -->
    <rect x="2.75" y="1" width="1.5" height="7" rx=".4"/>
    <rect x="1" y="2.75" width="5" height="1.5" rx=".4"/>
    <!-- lines of the creed -->
    <rect x="7.5" y="2.75" width="7.5" height="1.3" rx=".65"/>
    <rect x="7.5" y="6.35" width="7.5" height="1.3" rx=".65"/>
    <rect x="1" y="9.95" width="14" height="1.3" rx=".65"/>
    <rect x="1" y="13.55" width="9" height="1.3" rx=".65"/>
  </g>
</svg>
