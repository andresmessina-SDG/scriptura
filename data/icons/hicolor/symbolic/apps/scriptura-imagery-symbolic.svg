<?xml version="1.0" encoding="UTF-8"?>
<!--
  Framed-picture glyph anchoring the "Scripture in Art" hero row. Bundled,
  fill-only (an even-odd frame ring enclosing a solid sun and mountain) so
  GTK4 recolors it to @accent_color reliably, matching the commentary and
  globe symbolics alongside it.

  Weight pass 2026-07-17: frame 1.3 → 1.8 toward the GNOME 2px symbolic
  norm; sun and mountains nudged inward to keep clear of the heavier frame.

  Weight pass 2026-07-27: frame 1.8 → 2.0 (the 2026-07-17 pass stopped
  short of the norm) and the frame grown to 14x12, so it no longer reads
  smaller than the stock symbolics beside it. Sun and mountains moved out
  with the inner edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#222">
    <path fill-rule="evenodd" d="M3 2 H13 A2 2 0 0 1 15 4 V12 A2 2 0 0 1 13 14 H3 A2 2 0 0 1 1 12 V4 A2 2 0 0 1 3 2 Z M3.7 4 A0.7 0.7 0 0 0 3 4.7 V11.3 A0.7 0.7 0 0 0 3.7 12 H12.3 A0.7 0.7 0 0 0 13 11.3 V4.7 A0.7 0.7 0 0 0 12.3 4 Z"/>
    <circle cx="5.7" cy="6.5" r="1.3"/>
    <path d="M3.2 12 L6.5 8 L8.8 10.6 L10.5 8.7 L13 12 Z"/>
  </g>
</svg>
