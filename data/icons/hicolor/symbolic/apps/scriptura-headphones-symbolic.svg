<?xml version="1.0" encoding="UTF-8"?>
<!--
  Headphones for the pane toolbar's "Listen to this chapter" — the entry to
  the listening surface, where the play control itself lives on the pill.

  Bundled rather than using the stock audio-headphones-symbolic, which lives
  in the DEVICES category and is therefore whatever the user's icon theme
  says it is: Zorin's copy carries no viewBox, a translate(-405 195) group
  transform and a hardcoded #333 fill, and GTK's recolour of it came out as a
  solid filled block in the toolbar. Drawn here fill-only (#222, even-odd for
  the band) so GTK4 recolors it reliably, like the church / globe / timeline
  symbolics beside it.

  The band is an even-odd annulus clipped to its upper half; the earcups are
  rounded rects at the band's ends, weighted to read at 16px without the
  hollow look a stroked arc gives at this size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#222">
    <!-- the band: outer arc minus inner arc, flat-bottomed at the earcups -->
    <path fill-rule="evenodd" d="M8 1.6 A6.4 6.4 0 0 0 1.6 8 V9.2 H3.3 V8 A4.7 4.7 0 0 1 8 3.3 A4.7 4.7 0 0 1 12.7 8 V9.2 H14.4 V8 A6.4 6.4 0 0 0 8 1.6 Z"/>
    <!-- earcups -->
    <rect x="1.3" y="8.6" width="2.9" height="5.8" rx="1.45"/>
    <rect x="11.8" y="8.6" width="2.9" height="5.8" rx="1.45"/>
  </g>
</svg>
