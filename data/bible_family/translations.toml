# The Bible Family Tree — every English Bible, its descent and its place on
# the word-for-word ↔ free spectrum. Read by bible_family.py.
#
# The research record behind it (§ numbers below) is kept outside the repo.
# tests/test_bible_family.py checks this file.
#
# check   = "checked"   a second source agreed this session
#           "reference" one standard reference only
#           "disputed"  sources disagree; `dispute` says how; draw with "c."/a range
# year    = the year to plot: first complete publication of the node's scope
# base_*  = MT Masoretic · LXX Septuagint · VUL Vulgate · TR Textus Receptus ·
#           MAJ Byzantine/Majority · CT critical (NA/UBS/SBL/WH) · ENG an English
#           text (paraphrase) · SPA a Spanish text · MIX eclectic
# spectrum: band = [low, median, high] and n from §13.3 (0 = word-for-word end,
#           1 = The Message); measured = §15 (NT sample, "measured in Scriptura");
#           class = Fee & Strauss where they give one, else the translation's
#           self-described class; self = its own words, self_src = where.
# archaic = true: the text keeps thee/thou/unto English (23 or more such words
#           per 1,000 in the measured sample; the next text down has 15). The
#           measure reads these as supplied words, so such a Bible measures
#           about 0.05 freer than it is (§15.5); bible_family.py takes that
#           off before placing it.

schema = 1

